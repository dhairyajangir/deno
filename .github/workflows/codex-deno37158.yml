name: Deno ResponseInit 37158 candidate validation

on:
  push:
    branches:
      - validation/responseinit-37158-1112ct

permissions:
  contents: read

jobs:
  validate:
    if: >-
      ${{ github.event_name == 'push' && github.event.created &&
          github.repository == 'dhairyajangir/deno' &&
          github.event.repository.fork && !github.event.repository.private &&
          github.ref == 'refs/heads/validation/responseinit-37158-1112ct' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        suite: [style, runtime]
    env:
      EXPECTED_BASE: e7b39ebd55c85aaf6a29290c1f5a99e2e21e09dd
      EXPECTED_TREE: 1f146bec3625c8d785c2460e5a843620661dfdda
      PATCH_SHA256: d8b5d7f89b195ecf78d8c65613eff916df576fab586b6727faf3ce5c1b7e3fd4
      TEST_SHA256: 1866cec874b624887d0ea40d4713fdc19693ad99981583fe696ef82bec573c9d
      CARGO_PROFILE_DEV_DEBUG: 0
      NO_COLOR: 1
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify validation files and select reviewed candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 2
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_BASE"
          printf 'A\t.github/codex-deno37158.patch\nA\t.github/codex-deno37158.test.js\nA\t.github/workflows/codex-deno37158.yml\n' > "$RUNNER_TEMP/expected-paths.txt"
          git diff-tree --no-commit-id --name-status -r HEAD^1 HEAD > "$RUNNER_TEMP/actual-paths.txt"
          cmp "$RUNNER_TEMP/expected-paths.txt" "$RUNNER_TEMP/actual-paths.txt"
          test "$(git show -s --format='%ae|%ce' HEAD)" = 'thinkelite@hotmail.com|thinkelite@hotmail.com'
          cp .github/codex-deno37158.patch "$RUNNER_TEMP/candidate.patch"
          cp .github/codex-deno37158.test.js "$RUNNER_TEMP/standalone.test.js"
          printf '%s  %s\n' "$PATCH_SHA256" "$RUNNER_TEMP/candidate.patch" | sha256sum -c -
          printf '%s  %s\n' "$TEST_SHA256" "$RUNNER_TEMP/standalone.test.js" | sha256sum -c -
          git -c advice.detachedHead=false checkout --detach "$EXPECTED_BASE"
          git apply --check "$RUNNER_TEMP/candidate.patch"
          git apply "$RUNNER_TEMP/candidate.patch"
          git add -- ext/fetch/23_response.js tests/unit/response_test.ts
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --cached --name-only > "$RUNNER_TEMP/candidate-paths.txt"
          printf 'ext/fetch/23_response.js\ntests/unit/response_test.ts\n' > "$RUNNER_TEMP/expected-candidate-paths.txt"
          cmp "$RUNNER_TEMP/expected-candidate-paths.txt" "$RUNNER_TEMP/candidate-paths.txt"
          git diff --exit-code
          printf 'Candidate tree: %s\n' "$EXPECTED_TREE"

      - name: Install Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.9.8

      - name: Install repository Rust toolchain
        uses: dsherret/rust-toolchain-file@3551321aa44dd44a0393eb3b6bdfbc5d25ecf621

      - name: Initialize pinned standard-library test submodule
        run: git submodule update --init --recursive --depth=1 -- tests/util/std

      - name: Run project formatter and verify no changes
        if: ${{ matrix.suite == 'style' }}
        run: |
          set -euo pipefail
          ./x fmt
          git diff --exit-code

      - name: Run project lint
        if: ${{ matrix.suite == 'style' }}
        run: |
          set -euo pipefail
          ./x lint
          git diff --exit-code

      - name: Build candidate runtime
        if: ${{ matrix.suite == 'runtime' }}
        run: cargo build --locked -p deno --bin deno

      - name: Run standalone native regression cases
        if: ${{ matrix.suite == 'runtime' }}
        run: target/debug/deno test --no-config --no-lock "$RUNNER_TEMP/standalone.test.js"

      - name: Run project response test file directly
        if: ${{ matrix.suite == 'runtime' }}
        shell: bash
        run: |
          set -euo pipefail
          target/debug/deno test --config tests/config/deno.json --no-lock \
            --unstable-net --unstable-vsock --location=http://127.0.0.1:4545/ \
            --no-prompt -A tests/unit/response_test.ts 2>&1 | tee "$RUNNER_TEMP/project-response-test.log"
          for name in \
            'Response converts ResponseInit members in order (proxy: false)' \
            'Response converts ResponseInit members in order (proxy: true)' \
            'Response converts headers before reading status' \
            'Response.json converts ResponseInit members in order (proxy: false)' \
            'Response.json converts ResponseInit members in order (proxy: true)' \
            'Response.json converts headers before reading status' \
            'responseJsonConvertsInitBeforeSerializingData' \
            'responseJsonInitErrorPrecedesSerialization'; do
            grep -F -- "$name ... ok" "$RUNNER_TEMP/project-response-test.log"
          done
          grep -E '^ok \| 17 passed \| 0 failed' "$RUNNER_TEMP/project-response-test.log"
          git diff --exit-code
